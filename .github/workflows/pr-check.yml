name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CDK dependencies
        run: cd infra && npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Build application
        run: npm run build

      - name: Validate CDK
        run: |
          cd infra
          npx cdk synth

      - name: PR validation summary
        run: |
          echo "### PR Validation Passed ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All checks passed successfully!" >> $GITHUB_STEP_SUMMARY
